name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify
        run: |
          dotnet restore PlateauResoniteLink.sln --locked-mode --disable-build-servers
          dotnet format whitespace . --folder --verify-no-changes
          dotnet build PlateauResoniteLink.sln --configuration Release --no-restore --disable-build-servers -m:1 -p:UseSharedCompilation=false
          dotnet test PlateauResoniteLink.sln --configuration Release --no-restore --verbosity normal -m:1 --disable-build-servers -p:UseSharedCompilation=false

      - name: Compute release metadata
        id: metadata
        run: |
          set -euo pipefail
          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(git tag --sort=-version:refname | grep -Fxv "${current_tag}" | head -n 1 || true)"
          echo "previous_tag=${previous_tag}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=PlateauResoniteLink-cli-${current_tag}.zip" >> "${GITHUB_OUTPUT}"

      - name: Publish CLI
        run: dotnet publish src/PlateauResoniteLink.Cli/PlateauResoniteLink.Cli.csproj --configuration Release --no-restore --output artifacts/release/publish

      - name: Add asset readme
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          cat > artifacts/release/publish/README.txt <<EOF
          PlateauResoniteLink CLI ${CURRENT_TAG}

          This release asset is framework-dependent and requires .NET 10.

          Quick start:
            dotnet PlateauResoniteLink.Cli.dll --help

          Canonical changelog:
            https://github.com/${{ github.repository }}/releases/tag/${CURRENT_TAG}
          EOF

      - name: Archive CLI asset
        env:
          ASSET_NAME: ${{ steps.metadata.outputs.asset_name }}
        run: |
          set -euo pipefail
          cd artifacts/release/publish
          zip -r "../${ASSET_NAME}" .

      - name: Prepare release notes header
        env:
          CURRENT_TAG: ${{ github.ref_name }}
          PREVIOUS_TAG: ${{ steps.metadata.outputs.previous_tag }}
        run: |
          set -euo pipefail
          output_path="artifacts/release/notes.md"
          mkdir -p "$(dirname "${output_path}")"

          cat > "${output_path}" <<EOF
          ## Summary

          - Automated release for ${CURRENT_TAG}.
          - GitHub Releases are the canonical changelog for PlateauResoniteLink.
          - \`PlateauResoniteLink-cli-${CURRENT_TAG}.zip\` is a framework-dependent asset and requires .NET 10.

          EOF

          if [[ -z "${PREVIOUS_TAG}" ]]; then
            cat >> "${output_path}" <<'EOF'
          ## Initial release context

          This tag starts the formal GitHub Releases-based changelog for PlateauResoniteLink.

          Highlights before this first tagged release:
          - Added the live CLI pipeline for streaming PLATEAU CityGML datasets into Resonite through ResoniteLink.
          - Hardened direct archive imports with explicit remote archive validation, cache reuse, and pre-validation of import requests.
          - Added DEM terrain grid generation, placement fixes, and live asset reuse improvements.
          - Expanded automated coverage around CLI parsing, import validation, dataset discovery, DEM layout, and live send behavior.

          EOF
          else
            cat >> "${output_path}" <<EOF
          _Changes below were generated automatically from merged pull requests and commits since \`${PREVIOUS_TAG}\`._

          EOF
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ github.ref_name }}
          PREVIOUS_TAG: ${{ steps.metadata.outputs.previous_tag }}
          ASSET_NAME: ${{ steps.metadata.outputs.asset_name }}
        run: |
          set -euo pipefail
          args=(
            release create "${CURRENT_TAG}"
            "artifacts/release/${ASSET_NAME}#PlateauResoniteLink CLI ${CURRENT_TAG}"
            --verify-tag
            --title "${CURRENT_TAG}"
            --generate-notes
            --notes "$(cat artifacts/release/notes.md)"
            --latest
          )

          if [[ -n "${PREVIOUS_TAG}" ]]; then
            args+=(--notes-start-tag "${PREVIOUS_TAG}")
          fi

          gh "${args[@]}"
