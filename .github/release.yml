changelog:
  exclude:
    labels:
      - skip-release-notes
      - release
    authors:
      - github-actions[bot]
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - fix
        - bug
        - bugfix
    - title: Docs / Meta
      labels:
        - documentation
        - docs
        - meta
        - chore
    - title: Tests / Internal
      labels:
        - test
        - tests
        - internal
        - refactor
        - ci
        - build
